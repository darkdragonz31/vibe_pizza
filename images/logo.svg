  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold">
    <text x="130" y="48" font-size="36" fill="#f2b632">DRAGON'S</text>
    <text x="130" y="82" font-size="27" fill="#ffffff" letter-spacing="1">CRUNCHY KNIGHTS</text>
    <text x="131" y="110" font-size="22" fill="#ff6a5c" letter-spacing="9">PIZZA</text>
