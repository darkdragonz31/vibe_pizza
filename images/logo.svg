    <circle cx="60" cy="66" r="26" fill="#ffd86b"/>
    <g stroke="#d98a1f" stroke-width="1.6" stroke-linecap="round">
      <line x1="60" y1="66" x2="60" y2="40"/>
      <line x1="60" y1="66" x2="82.5" y2="53"/>
      <line x1="60" y1="66" x2="82.5" y2="79"/>
      <line x1="60" y1="66" x2="60" y2="92"/>
